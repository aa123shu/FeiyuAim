# Paste these locations inside the existing server { } block in kami-ip.conf.
# Keep the current /api/ location unchanged.
location = /community {
    return 301 /community/;
}

location ^~ /community-api/ {
    client_max_body_size 105m;
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location ^~ /community/ {
    root /www/wwwroot/kami/frontend/dist;
    try_files $uri $uri/ /community/index.html;
}
